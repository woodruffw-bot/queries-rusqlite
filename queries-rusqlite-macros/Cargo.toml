[package]
name = "queries-rusqlite-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Macros for queries-rusqlite"
license = "BSD-3-Clause"
repository = "https://github.com/woodruffw-bot/queries-rusqlite"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "proc-macro", "clone-impls", "derive"] }
